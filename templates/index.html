<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Audio Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #232733;
      --border: #2e3345;
      --text: #e4e6ed;
      --text2: #9298ad;
      --accent: #6c8cff;
      --accent-dim: #4a62b3;
      --red: #ff6b6b;
      --green: #51cf66;
      --radius: 10px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: .25rem;
    }

    .subtitle {
      color: var(--text2);
      font-size: .95rem;
      margin-bottom: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }

    /* Panels */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
    }

    .panel h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: .75rem;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: .04em;
      font-size: .8rem;
    }

    /* Textarea */
    textarea {
      width: 100%;
      min-height: 260px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .95rem;
      padding: .85rem;
      resize: vertical;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      line-height: 1.65;
    }

    textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }

    textarea::placeholder { color: var(--text2); opacity: .6; }

    /* Voice config */
    .voice-row {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: .6rem;
    }

    .voice-row label {
      min-width: 70px;
      font-size: .85rem;
      font-weight: 600;
      color: var(--accent);
    }

    .voice-row select {
      flex: 1;
      padding: .4rem .6rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: .82rem;
    }

    /* Rate slider */
    .rate-group {
      margin-top: 1rem;
    }

    .rate-group label {
      display: block;
      font-size: .85rem;
      margin-bottom: .35rem;
      color: var(--text2);
    }

    .rate-row {
      display: flex;
      align-items: center;
      gap: .6rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .rate-value {
      font-size: .82rem;
      color: var(--text2);
      min-width: 40px;
      text-align: right;
      font-family: monospace;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: .65rem 1.4rem;
      border: none;
      border-radius: var(--radius);
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }

    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      width: 100%;
      margin-top: 1rem;
    }

    .btn-primary:hover:not(:disabled) { background: var(--accent-dim); }

    .btn-download {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: .82rem;
      padding: .45rem 1rem;
      margin-top: .6rem;
    }

    .btn-download:hover { background: var(--border); }

    /* Status */
    .status {
      margin-top: .75rem;
      font-size: .82rem;
      color: var(--text2);
      min-height: 1.4em;
    }

    .status.error { color: var(--red); }
    .status.success { color: var(--green); }

    /* Audio player */
    .player-area {
      margin-top: 1rem;
      display: none;
    }

    .player-area.visible { display: block; }

    audio {
      width: 100%;
      border-radius: var(--radius);
    }

    #voiceConfig {
      min-height: 40px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--text2);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      vertical-align: middle;
      margin-right: .3rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Pinyin overlay (replaces textarea in-place) */
    .text-wrapper { position: relative; }

    .pinyin-overlay {
      display: none;
      width: 100%;
      min-height: 260px;
      max-height: 500px;
      overflow-y: auto;
      background: var(--surface2);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .95rem;
      padding: .85rem;
      line-height: 2.6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .pinyin-overlay.visible { display: block; cursor: text; }
    .pinyin-overlay.visible + textarea { display: none; }

    .pinyin-overlay.visible,
    .highlight-overlay.visible { position: relative; }

    .pinyin-overlay.visible::after,
    .highlight-overlay.visible::after {
      content: "click here or start typing to edit";
      position: absolute;
      bottom: 6px;
      right: 10px;
      font-size: .65rem;
      color: var(--text2);
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }

    .text-wrapper:hover > .pinyin-overlay.visible::after,
    .text-wrapper:hover > .highlight-overlay.visible::after {
      opacity: .6;
    }

    .pinyin-overlay ruby { margin: 0 .02em; }
    .pinyin-overlay rt {
      font-size: .55em;
      color: var(--accent);
      font-weight: 500;
    }
    .pinyin-overlay rt.sandhi {
      color: #e8a855;
    }
    .pinyin-overlay ruby:has(rt.sandhi) {
      cursor: help;
    }

    .btn-tool {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: .82rem;
      padding: .45rem 1rem;
    }
    .btn-tool:hover:not(:disabled) { background: var(--border); }
    .btn-tool.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Highlight overlay — mirrors textarea by default */
    .highlight-overlay {
      display: none;
      width: 100%;
      min-height: 260px;
      max-height: 500px;
      overflow-y: auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .95rem;
      padding: .85rem;
      font-family: "SF Mono", "Fira Code", "Consolas", monospace;
      line-height: 1.65;
      white-space: pre-wrap;
    }

    .highlight-overlay.visible { display: block; cursor: text; }
    .highlight-overlay.visible ~ .pinyin-overlay,
    .highlight-overlay.visible ~ textarea { display: none; }

    .highlight-overlay.with-pinyin {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 2.6;
      border-color: var(--accent);
      white-space: normal;
    }

    .highlight-overlay ruby { margin: 0 .02em; }
    .highlight-overlay rt {
      font-size: .55em;
      color: var(--accent);
      font-weight: 500;
    }
    .highlight-overlay rt.sandhi { color: #e8a855; }
    .highlight-overlay ruby:has(rt.sandhi) { cursor: help; }

    .hw-active {
      background: rgba(255, 90, 90, 0.35);
      border-radius: 2px;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: .75rem;
    }
    .panel-header h2 { margin-bottom: 0; }

    .btn-shuffle {
      background: transparent;
      border: none;
      color: var(--text2);
      font-size: .72rem;
      font-weight: 500;
      padding: .25rem .5rem;
      gap: .25rem;
      border-radius: 6px;
      cursor: pointer;
      transition: color .15s, background .15s;
    }
    .btn-shuffle:hover { color: var(--text); background: var(--surface2); }
    .btn-shuffle:disabled { opacity: .4; cursor: not-allowed; }
    .btn-shuffle svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    .tool-bar {
      display: flex;
      justify-content: center;
      gap: .5rem;
      margin-top: .5rem;
    }

    /* Translation tooltip */
    .translate-tip {
      position: fixed;
      z-index: 1000;
      display: none;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: .5rem .75rem;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,.45);
      pointer-events: none;
    }

    .translate-tip.visible { display: block; }

    .translate-tip-zh {
      font-size: .85rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: .2rem;
    }

    .translate-tip-en {
      font-size: .88rem;
      color: var(--text);
    }

    .translate-tip.loading .translate-tip-en::after {
      content: "";
      display: inline-block;
      width: 10px; height: 10px;
      border: 2px solid var(--text2);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      margin-left: .35rem;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Chinese Audio Generator</h1>
    <p class="subtitle">Paste a dialogue, pick voices, generate MP3 with different speakers</p>

    <div class="grid">
      <!-- Left: main area -->
      <div>
        <div class="panel">
          <div class="panel-header">
            <h2>Dialogue Text</h2>
            <button class="btn btn-shuffle" id="shuffleBtn" title="Load a random conversation">
              <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.18 1.42-1.42zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
              Shuffle
            </button>
          </div>
          <div class="text-wrapper">
            <div class="highlight-overlay" id="highlightOverlay"></div>
            <div class="pinyin-overlay" id="pinyinOverlay"></div>
            <textarea id="dialogueText" placeholder="售货员：您好！您要什么？&#10;顾客：我要两件T恤。&#10;售货员：一共三百三十二块。">{{ default_text }}</textarea>
          </div>
          <div class="tool-bar">
            <button class="btn btn-tool" id="pinyinBtn">Show Pinyin</button>
            <button class="btn btn-tool" id="highlightBtn" disabled>Highlight Words</button>
          </div>
        </div>

        <div class="player-area" id="playerArea">
          <div class="panel">
            <h2>Result</h2>
            <audio id="audioPlayer" controls></audio>
            <button class="btn btn-download" id="downloadBtn">Download MP3</button>
          </div>
        </div>
      </div>

      <!-- Right: config sidebar -->
      <div>
        <div class="panel">
          <h2>Voices</h2>
          <div id="voiceConfig">
            <p style="font-size:.82rem;color:var(--text2)">Paste text to detect speakers...</p>
          </div>
        </div>

        <div class="panel" style="margin-top:1rem">
          <h2>Speed</h2>
          <div class="rate-group">
            <label>Speech rate</label>
            <div class="rate-row">
              <input type="range" id="rateSlider" min="-50" max="50" value="0" step="5">
              <span class="rate-value" id="rateDisplay">+0%</span>
            </div>
          </div>
        </div>

        <button class="btn btn-primary" id="generateBtn" disabled>Generate Audio</button>
        <div class="status" id="status"></div>
      </div>
    </div>
  </div>

  <div class="translate-tip" id="translateTip">
    <div class="translate-tip-zh" id="tipZh"></div>
    <div class="translate-tip-en" id="tipEn"></div>
  </div>

  <script nonce="{{ csp_nonce() }}">
    const VOICES = {{ voices | tojson }};

    const dialogueText = document.getElementById("dialogueText");
    const voiceConfig = document.getElementById("voiceConfig");
    const rateSlider = document.getElementById("rateSlider");
    const rateDisplay = document.getElementById("rateDisplay");
    const generateBtn = document.getElementById("generateBtn");
    const status = document.getElementById("status");
    const playerArea = document.getElementById("playerArea");
    const audioPlayer = document.getElementById("audioPlayer");
    const downloadBtn = document.getElementById("downloadBtn");
    const pinyinBtn = document.getElementById("pinyinBtn");
    const pinyinOverlay = document.getElementById("pinyinOverlay");
    const highlightBtn = document.getElementById("highlightBtn");
    const highlightOverlay = document.getElementById("highlightOverlay");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const translateTip = document.getElementById("translateTip");
    const tipZh = document.getElementById("tipZh");
    const tipEn = document.getElementById("tipEn");

    let currentVoiceMap = {};
    let currentAudioUrl = null;
    let parseTimeout = null;
    let pinyinVisible = false;
    let highlightEnabled = false;
    let timingData = null;
    let pinyinCache = null;
    let translateAbort = null;
    let lastActiveHw = null;

    async function apiFetch(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        location.reload();
        throw new Error("Passcode required");
      }
      return res;
    }

    rateSlider.addEventListener("input", () => {
      const v = parseInt(rateSlider.value);
      rateDisplay.textContent = (v >= 0 ? "+" : "") + v + "%";
    });

    function resetOverlays() {
      if (pinyinVisible) {
        pinyinOverlay.classList.remove("visible");
        pinyinBtn.textContent = "Show Pinyin";
        pinyinBtn.classList.remove("active");
        pinyinVisible = false;
      }
      if (highlightEnabled) {
        highlightOverlay.classList.remove("visible", "with-pinyin");
        highlightBtn.textContent = "Highlight Words";
        highlightBtn.classList.remove("active");
        highlightEnabled = false;
      }
      if (lastActiveHw) { lastActiveHw.classList.remove("hw-active"); lastActiveHw = null; }
      timingData = null;
      pinyinCache = null;
      highlightBtn.disabled = true;
      hideTranslateTip();
    }

    function hideTranslateTip() {
      translateTip.classList.remove("visible", "loading");
      if (translateAbort) { translateAbort.abort(); translateAbort = null; }
    }

    dialogueText.addEventListener("input", () => {
      clearTimeout(parseTimeout);
      parseTimeout = setTimeout(parseSpeakers, 400);
      resetOverlays();
    });

    async function parseSpeakers() {
      const text = dialogueText.value.trim();
      if (!text) {
        voiceConfig.innerHTML = '<p style="font-size:.82rem;color:var(--text2)">Paste text to detect speakers...</p>';
        generateBtn.disabled = true;
        return;
      }

      const res = await apiFetch("/parse", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const data = await res.json();

      if (!data.speakers || data.speakers.length === 0) {
        voiceConfig.innerHTML = '<p style="font-size:.82rem;color:var(--text2)">No speakers detected</p>';
        generateBtn.disabled = true;
        return;
      }

      currentVoiceMap = data.defaults;
      let html = "";
      for (const speaker of data.speakers) {
        const defaultVoice = data.defaults[speaker] || Object.keys(VOICES)[0];
        html += `<div class="voice-row">
          <label>${escHtml(speaker)}</label>
          <select data-speaker="${escHtml(speaker)}">`;
        for (const [id, label] of Object.entries(VOICES)) {
          const sel = id === defaultVoice ? " selected" : "";
          html += `<option value="${id}"${sel}>${label}</option>`;
        }
        html += `</select></div>`;
      }
      voiceConfig.innerHTML = html;
      generateBtn.disabled = false;
    }

    voiceConfig.addEventListener("change", (e) => {
      const el = e.target;
      if (el.matches("select[data-speaker]")) currentVoiceMap[el.dataset.speaker] = el.value;
    });

    generateBtn.addEventListener("click", async () => {
      const text = dialogueText.value.trim();
      if (!text) return;

      generateBtn.disabled = true;
      status.className = "status";
      status.innerHTML = '<span class="spinner"></span>Generating audio...';
      playerArea.classList.remove("visible");

      if (highlightEnabled) {
        highlightOverlay.classList.remove("visible", "with-pinyin");
        highlightBtn.textContent = "Highlight Words";
        highlightBtn.classList.remove("active");
        highlightEnabled = false;
      }
      if (lastActiveHw) { lastActiveHw.classList.remove("hw-active"); lastActiveHw = null; }
      timingData = null;
      pinyinCache = null;
      highlightBtn.disabled = true;

      try {
        const rate = (parseInt(rateSlider.value) >= 0 ? "+" : "") + rateSlider.value + "%";

        const res = await apiFetch("/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, voice_map: currentVoiceMap, rate }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || "Generation failed (HTTP " + res.status + ")");
        }

        const data = await res.json();
        const bytes = Uint8Array.from(atob(data.audio), (c) => c.charCodeAt(0));
        if (currentAudioUrl) URL.revokeObjectURL(currentAudioUrl);
        currentAudioUrl = URL.createObjectURL(new Blob([bytes], { type: "audio/mpeg" }));
        timingData = data.timing;

        audioPlayer.src = currentAudioUrl;
        playerArea.classList.add("visible");
        highlightBtn.disabled = false;
        status.className = "status success";
        status.textContent = "Audio generated successfully!";
      } catch (e) {
        status.className = "status error";
        status.textContent = "Error: " + e.message;
      } finally {
        generateBtn.disabled = false;
      }
    });

    function interpolateCharTiming(text, words) {
      const result = [];
      let covered = 0;
      for (const w of (words || [])) {
        const idx = text.indexOf(w.text, covered);
        const startIdx = idx >= 0 ? idx : covered;
        if (startIdx > covered) {
          for (let j = covered; j < startIdx; j++)
            result.push({ char: text[j], start: null, end: null });
        }
        const chars = [...w.text];
        const dur = w.end - w.start;
        const perChar = dur / chars.length;
        for (let k = 0; k < chars.length; k++) {
          result.push({
            char: chars[k],
            start: +(w.start + k * perChar).toFixed(3),
            end: +(w.start + (k + 1) * perChar).toFixed(3),
          });
        }
        covered = startIdx + w.text.length;
      }
      for (let j = covered; j < text.length; j++)
        result.push({ char: text[j], start: null, end: null });
      return result;
    }

    function parsePinyinChars(pinyinHtml) {
      const tmp = document.createElement("div");
      tmp.innerHTML = pinyinHtml;
      const chars = [];
      for (const node of tmp.childNodes) {
        if (node.nodeType === Node.TEXT_NODE) {
          for (const c of node.textContent) chars.push({ char: c, html: escHtml(c) });
        } else if (node.nodeName === "RUBY") {
          const base = node.childNodes[0]?.textContent || "";
          chars.push({ char: base, html: node.outerHTML });
        } else {
          const t = node.textContent || "";
          for (const c of t) chars.push({ char: c, html: escHtml(c) });
        }
      }
      return chars;
    }

    function buildHighlightHtml(timing, withPinyin, pinyinLines) {
      const parts = [];
      for (let li = 0; li < timing.length; li++) {
        const line = timing[li];
        const prefix = line.speaker + "\uff1a";
        const charTimings = interpolateCharTiming(line.text, line.words);

        let pinyinChars = null;
        if (withPinyin && pinyinLines && pinyinLines[li]) {
          pinyinChars = parsePinyinChars(pinyinLines[li]);
        }

        let lineHtml = "";
        const prefixLen = [...prefix].length;

        if (pinyinChars) {
          for (let ci = 0; ci < prefixLen && ci < pinyinChars.length; ci++)
            lineHtml += pinyinChars[ci].html;
        } else {
          lineHtml += escHtml(prefix);
        }

        for (let ci = 0; ci < charTimings.length; ci++) {
          const ct = charTimings[ci];
          let charHtml;
          if (pinyinChars) {
            const pi = prefixLen + ci;
            charHtml = pi < pinyinChars.length ? pinyinChars[pi].html : escHtml(ct.char);
          } else {
            charHtml = escHtml(ct.char);
          }
          if (ct.start !== null) {
            lineHtml += `<span class="hw" data-start="${ct.start}" data-end="${ct.end}">${charHtml}</span>`;
          } else {
            lineHtml += charHtml;
          }
        }
        parts.push(lineHtml);
      }
      return withPinyin ? parts.join("<br>") : parts.join("\n");
    }

    function escHtml(s) {
      return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    }

    async function fetchPinyinLines() {
      if (pinyinCache) return pinyinCache;
      const text = dialogueText.value.trim();
      if (!text) return null;
      try {
        const res = await apiFetch("/pinyin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const data = await res.json();
        pinyinCache = data.html.split("<br>");
        return pinyinCache;
      } catch { return null; }
    }

    async function renderDisplay() {
      highlightOverlay.classList.remove("visible", "with-pinyin");
      pinyinOverlay.classList.remove("visible");

      if (highlightEnabled && timingData) {
        const pinyinLines = pinyinVisible ? await fetchPinyinLines() : null;
        highlightOverlay.innerHTML = buildHighlightHtml(timingData, pinyinVisible, pinyinLines);
        if (pinyinVisible) highlightOverlay.classList.add("with-pinyin");
        highlightOverlay.querySelectorAll("rt.sandhi").forEach(rt => {
          rt.closest("ruby").title = "tone sandhi (spoken differently)";
        });
        highlightOverlay.classList.add("visible");
      } else if (pinyinVisible) {
        const lines = await fetchPinyinLines();
        if (lines) {
          pinyinOverlay.innerHTML = lines.join("<br>");
          pinyinOverlay.querySelectorAll("rt.sandhi").forEach(rt => {
            rt.closest("ruby").title = "tone sandhi (spoken differently)";
          });
        }
        pinyinOverlay.classList.add("visible");
      }
    }

    highlightBtn.addEventListener("click", async () => {
      if (!timingData) return;
      highlightEnabled = !highlightEnabled;
      highlightBtn.textContent = highlightEnabled ? "Stop Highlight" : "Highlight Words";
      highlightBtn.classList.toggle("active", highlightEnabled);
      await renderDisplay();
    });

    pinyinBtn.addEventListener("click", async () => {
      pinyinVisible = !pinyinVisible;
      pinyinBtn.textContent = pinyinVisible ? "Hide Pinyin" : "Show Pinyin";
      pinyinBtn.classList.toggle("active", pinyinVisible);
      await renderDisplay();
    });

    audioPlayer.addEventListener("timeupdate", () => {
      if (!highlightEnabled || !timingData) return;
      const t = audioPlayer.currentTime;
      const allHw = highlightOverlay.querySelectorAll(".hw");

      if (lastActiveHw) {
        const s = parseFloat(lastActiveHw.dataset.start);
        const e = parseFloat(lastActiveHw.dataset.end);
        if (t >= s && t < e) return;
        lastActiveHw.classList.remove("hw-active");
        lastActiveHw = null;
      }

      for (const el of allHw) {
        const s = parseFloat(el.dataset.start);
        const e = parseFloat(el.dataset.end);
        if (t >= s && t < e) {
          el.classList.add("hw-active");
          el.scrollIntoView({ block: "nearest", behavior: "smooth" });
          lastActiveHw = el;
          return;
        }
      }
    });

    audioPlayer.addEventListener("ended", () => {
      if (lastActiveHw) { lastActiveHw.classList.remove("hw-active"); lastActiveHw = null; }
    });

    // Called from the browser rather than the server: Google blocks this
    // unofficial endpoint from cloud hosts such as Render, but not from
    // visitors' own connections.
    async function googleTranslate(text, signal) {
      const params = new URLSearchParams({ client: "gtx", sl: "zh-CN", tl: "en", dt: "t", q: text });
      const res = await fetch("https://translate.googleapis.com/translate_a/single?" + params, { signal });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      return data[0].map((seg) => seg[0] || "").join("");
    }

    async function showTranslateTip(selectedText, x, y) {
      const cleaned = selectedText.trim();
      if (!cleaned) return;

      hideTranslateTip();

      tipZh.textContent = cleaned;
      tipEn.textContent = "";
      translateTip.classList.add("visible", "loading");

      const tipW = 280, tipH = 70, pad = 12;
      let left = x + pad;
      let top = y + pad;
      if (left + tipW > window.innerWidth) left = x - tipW - pad;
      if (top + tipH > window.innerHeight) top = y - tipH - pad;
      translateTip.style.left = Math.max(4, left) + "px";
      translateTip.style.top = Math.max(4, top) + "px";

      translateAbort = new AbortController();
      try {
        tipEn.textContent = await googleTranslate(cleaned, translateAbort.signal);
        translateTip.classList.remove("loading");
      } catch (e) {
        if (e.name !== "AbortError") {
          tipEn.textContent = "(translation failed)";
          translateTip.classList.remove("loading");
        }
      }
    }

    dialogueText.addEventListener("mouseup", (e) => {
      const sel = dialogueText.value.substring(dialogueText.selectionStart, dialogueText.selectionEnd);
      if (sel.trim()) showTranslateTip(sel, e.clientX, e.clientY);
      else hideTranslateTip();
    });

    function getSelectedChineseOnly() {
      const selection = window.getSelection();
      if (!selection.rangeCount) return "";
      const frag = selection.getRangeAt(0).cloneContents();
      frag.querySelectorAll("rt, rp").forEach(el => el.remove());
      return (frag.textContent || "").trim();
    }

    pinyinOverlay.addEventListener("mouseup", (e) => {
      const sel = getSelectedChineseOnly();
      if (sel) { showTranslateTip(sel, e.clientX, e.clientY); return; }
      hideTranslateTip();
      dismissOverlaysAndEdit();
    });

    highlightOverlay.addEventListener("mouseup", (e) => {
      const sel = getSelectedChineseOnly();
      if (sel) { showTranslateTip(sel, e.clientX, e.clientY); return; }
      hideTranslateTip();
      dismissOverlaysAndEdit();
    });

    function dismissOverlaysAndEdit() {
      let changed = false;
      if (pinyinVisible) {
        pinyinVisible = false;
        pinyinBtn.textContent = "Show Pinyin";
        pinyinBtn.classList.remove("active");
        changed = true;
      }
      if (highlightEnabled) {
        highlightEnabled = false;
        highlightBtn.textContent = "Highlight Words";
        highlightBtn.classList.remove("active");
        changed = true;
      }
      if (changed) {
        renderDisplay().then(() => dialogueText.focus());
      }
      return changed;
    }

    document.addEventListener("keydown", (e) => {
      if (!pinyinVisible && !highlightEnabled) return;
      if (document.activeElement === dialogueText) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (e.key.length === 1 || e.key === "Backspace" || e.key === "Delete") {
        dismissOverlaysAndEdit();
      }
    });

    document.addEventListener("mousedown", (e) => {
      if (translateTip.contains(e.target)) return;
      hideTranslateTip();
    });

    // Download
    downloadBtn.addEventListener("click", () => {
      if (!currentAudioUrl) return;
      const a = document.createElement("a");
      a.href = currentAudioUrl;
      a.download = "dialogue.mp3";
      a.click();
    });

    // Shuffle: load a random conversation from the library
    shuffleBtn.addEventListener("click", async () => {
      shuffleBtn.disabled = true;
      try {
        const res = await apiFetch("/random-conversation");
        const data = await res.json();
        dialogueText.value = data.text;
        resetOverlays();
        playerArea.classList.remove("visible");
        await parseSpeakers();
      } catch (e) {
        status.className = "status error";
        status.textContent = "Failed to load conversation";
      } finally {
        shuffleBtn.disabled = false;
      }
    });

    // Auto-parse default text on load
    if (dialogueText.value.trim()) parseSpeakers();
  </script>
</body>
</html>
