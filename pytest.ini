[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not live"
markers =
    live: calls Microsoft's speech service over the network (run with -m live)
# pypinyin 0.55.0 uses codecs.open(), which Python 3.14 deprecates. Harmless until
# Python removes it; MAINTENANCE.md tracks it.
filterwarnings =
    ignore:codecs.open\(\) is deprecated:DeprecationWarning
